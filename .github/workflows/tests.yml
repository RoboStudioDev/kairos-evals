# Free checks on every push: unit tests and the self-test (no model calls, no secrets).
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Word list for the names check
        run: sudo apt-get update -q && sudo apt-get install -y -q wamerican
      - name: Unit tests
        run: python -m unittest -v
      - name: Self-test (every check must catch its planted mistake)
        run: python -m kairos_evals selftest
